name: Build

on:
  push:
  pull_request:

jobs:
  swiftpm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core logic
        run: ./build.sh test
      - name: Build and package app
        run: ./build.sh dist
      - name: Check signature and entitlements
        run: codesign --display --entitlements - build/OnlineStatus.app
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineStatus
          path: build/OnlineStatus-*.zip

  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build with Xcode
        run: xcodebuild -project OnlineStatus.xcodeproj -scheme OnlineStatus -configuration Release CODE_SIGNING_ALLOWED=NO build
